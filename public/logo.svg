<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Outer circle — brand green -->
  <circle cx="32" cy="32" r="30" fill="#0f4c35"/>
  <!-- Dashed measurement ring — represents MUAC tape -->
  <circle cx="32" cy="32" r="19" fill="none" stroke="white" stroke-width="2.5" stroke-dasharray="4.5 3" stroke-linecap="round"/>
  <!-- Clinical cross — vertical -->
  <line x1="32" y1="14" x2="32" y2="50" stroke="white" stroke-width="3" stroke-linecap="round"/>
  <!-- Clinical cross — horizontal -->
  <line x1="14" y1="32" x2="50" y2="32" stroke="white" stroke-width="3" stroke-linecap="round"/>
  <!-- Centre measurement dot — leaf green -->
  <circle cx="32" cy="32" r="5" fill="#22c55e"/>
</svg>